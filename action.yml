name: Krinos
description: Prove which security findings actually matter — triage your scanners' output and gate the build on what can really hurt you.
author: Krinos

branding:
  icon: filter
  color: orange

inputs:
  reports:
    description: |
      Files or directories holding scanner reports. Space-separated.
      Directories are read one level deep for *.json and *.sarif.
    required: false
    default: ./security-reports

  fail-on:
    description: 'Gate threshold: act, watch or never.'
    required: false
    default: act

  soft-fail:
    description: |
      Never fail the step, even when the gate fails. Use this while adopting
      Krinos, then branch on the `act` output yourself.
    required: false
    default: 'false'

  show:
    description: 'Which verdicts to include: act, watch, suppressed or all.'
    required: false
    default: act

  limit:
    description: 'Maximum findings shown per section. 0 for no limit.'
    required: false
    default: '20'

  annotate:
    description: 'Emit inline annotations on the changed lines.'
    required: false
    default: 'true'

  annotate-watch:
    description: 'Also annotate watch-level findings, as warnings.'
    required: false
    default: 'false'

  ignore:
    description: 'Fingerprints, CVE IDs or rule IDs to drop before triage. One per line.'
    required: false
    default: ''

  epss:
    description: 'Path to an EPSS dataset (JSON object mapping CVE ID to probability).'
    required: false
    default: ''

  json-out:
    description: 'Where to write the machine-readable report. Empty to skip.'
    required: false
    default: krinos-report.json

  version:
    description: |
      Krinos release to install, e.g. v0.2.0, or "latest".
      Defaults to the ref this action was called with, so pinning the action
      pins the binary.
    required: false
    default: ''

  token:
    description: |
      Token used to download the release. Only needed while the Krinos
      repository is private; public releases download without one.
    required: false
    default: ${{ github.token }}

outputs:
  ingested:
    description: Findings reported by all scanners, before any triage.
    value: ${{ steps.scan.outputs.ingested }}
  unique:
    description: Distinct real-world problems after cross-scanner dedup.
    value: ${{ steps.scan.outputs.unique }}
  duplicates:
    description: Reports folded away as duplicates.
    value: ${{ steps.scan.outputs.duplicates }}
  act:
    description: Findings that need action.
    value: ${{ steps.scan.outputs.act }}
  watch:
    description: Findings worth tracking but not gating on.
    value: ${{ steps.scan.outputs.watch }}
  suppressed:
    description: Findings suppressed, each with a recorded reason.
    value: ${{ steps.scan.outputs.suppressed }}
  reduction:
    description: Percentage of reported findings that need no action today.
    value: ${{ steps.scan.outputs.reduction }}
  passed:
    description: Whether the gate passed.
    value: ${{ steps.scan.outputs.passed }}
  report:
    description: Path to the JSON report, if one was written.
    value: ${{ inputs.json-out }}

runs:
  using: composite
  steps:
    - name: Install Krinos
      shell: bash
      env:
        KRINOS_VERSION: ${{ inputs.version != '' && inputs.version || github.action_ref }}
        GH_REPO: Beeeeen/krinos
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Downloads go through `gh` whenever it is available, because that is
        # the only path that works while the Krinos repository is private —
        # an unauthenticated curl against a private release asset 404s, and
        # the resulting error tells the user nothing useful. Plain curl
        # remains the fallback for self-hosted runners without the gh CLI.
        use_gh=false
        if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
          use_gh=true
        fi

        version="${KRINOS_VERSION:-latest}"
        if [ "$version" = "latest" ] || [ -z "$version" ]; then
          if [ "$use_gh" = true ]; then
            version="$(gh release view --repo "${GH_REPO}" --json tagName --jq .tagName)"
          else
            version="$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
              "https://github.com/${GH_REPO}/releases/latest" | sed 's#.*/tag/##')"
          fi
        fi
        echo "installing krinos ${version}"

        case "$(uname -s)" in
          Linux)   os=linux   ;;
          Darwin)  os=darwin  ;;
          MINGW*|MSYS*|CYGWIN*) os=windows ;;
          *) echo "::error::unsupported runner OS: $(uname -s)"; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          arm64|aarch64) arch=arm64 ;;
          *) echo "::error::unsupported runner architecture: $(uname -m)"; exit 1 ;;
        esac

        binary=krinos
        if [ "$os" = "windows" ]; then binary=krinos.exe; fi

        archive="krinos_${version}_${os}_${arch}.tar.gz"
        tmp="$(mktemp -d)"

        if [ "$use_gh" = true ]; then
          gh release download "${version}" --repo "${GH_REPO}" \
            --pattern "${archive}" --pattern checksums.txt --dir "${tmp}"
        else
          base="https://github.com/${GH_REPO}/releases/download/${version}"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
        fi

        # A security tool that installs itself over an unverified download has
        # no business gating anyone's build. macOS ships shasum rather than
        # sha256sum, so both are supported — and when neither exists we refuse
        # to install rather than quietly skipping the check.
        if command -v sha256sum >/dev/null 2>&1; then
          ( cd "${tmp}" && grep " ${archive}\$" checksums.txt | sha256sum -c - )
        elif command -v shasum >/dev/null 2>&1; then
          ( cd "${tmp}" && grep " ${archive}\$" checksums.txt | shasum -a 256 -c - )
        else
          echo "::error title=Krinos::no SHA-256 tool on this runner; refusing to install an unverified binary"
          exit 1
        fi

        mkdir -p "${HOME}/.krinos/bin"
        tar -xzf "${tmp}/${archive}" -C "${HOME}/.krinos/bin" "${binary}"
        chmod +x "${HOME}/.krinos/bin/${binary}"
        echo "${HOME}/.krinos/bin" >> "$GITHUB_PATH"

        rm -rf "${tmp}"

    - name: Triage
      id: scan
      shell: bash
      env:
        IN_REPORTS: ${{ inputs.reports }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_SHOW: ${{ inputs.show }}
        IN_LIMIT: ${{ inputs.limit }}
        IN_ANNOTATE: ${{ inputs.annotate }}
        IN_ANNOTATE_WATCH: ${{ inputs.annotate-watch }}
        IN_IGNORE: ${{ inputs.ignore }}
        IN_EPSS: ${{ inputs.epss }}
        IN_JSON_OUT: ${{ inputs.json-out }}
        IN_SOFT_FAIL: ${{ inputs.soft-fail }}
      run: |
        set -uo pipefail

        args=(scan --fail-on "${IN_FAIL_ON}" --show "${IN_SHOW}" --limit "${IN_LIMIT}")

        if [ "${IN_ANNOTATE}" = "true" ]; then
          args+=(--format github)
        else
          args+=(--format text --color)
        fi
        if [ "${IN_ANNOTATE_WATCH}" = "true" ]; then
          args+=(--annotate-watch)
        fi
        if [ -n "${IN_JSON_OUT}" ]; then
          args+=(--json-out "${IN_JSON_OUT}")
        fi
        if [ -n "${IN_EPSS}" ]; then
          args+=(--epss "${IN_EPSS}")
        fi
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--ignore "$line")
        done <<< "${IN_IGNORE}"

        # Word splitting on IN_REPORTS is intended: it is a space-separated
        # list of paths.
        # shellcheck disable=SC2086
        krinos "${args[@]}" ${IN_REPORTS}
        code=$?

        # Krinos writes its step outputs before it exits, so they are already
        # in $GITHUB_OUTPUT whatever the gate decided.
        if [ "${IN_SOFT_FAIL}" = "true" ]; then
          if [ "$code" -eq 1 ]; then
            echo "::notice title=Krinos::gate failed but soft-fail is on; check the 'act' output"
          fi
          exit 0
        fi
        exit $code
